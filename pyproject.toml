[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moses"
version = "0.1.0"
description = "LLM-guided evolutionary search over Python programs"
requires-python = ">=3.10"
dependencies = ["openai==3.51.0", "anthropic==2.8.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["moses*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
markers = ["live: calls a real LLM API (needs an API key)"]
